<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="scripts/index.js"></script>
    <script src="scripts/main.js"></script>
    <script src="scripts/query.js"></script>
    <title>GGE Player Data Logger</title>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg style-dark">
            <div class="container">
                <p class="navbar-brand">GGE Player Data Logger</p>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link js-button js-button-sort" data-what="Sort" href="#">Sorting</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link js-button js-button-filter c-button__red" data-what="filter"
                                href="#">Filters</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <div class="js-filters">
        <div class="container my-4" id="filter-container">
            <h2 class="text-center text-white mb-4">Filtering</h2>
            <div class="row g-3">
                <div class="col-12 col-md-6 col-lg-3">
                    <div class="card text-white h-100">
                        <div class="card-header">OID</div>
                        <div class="card-body">
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="OID-filter-enable">
                                <label class="form-check-label" for="OID-filter-enable">Enable Filter</label>
                            </div>
                            <input type="text" class="form-control" id="OID-filter" placeholder="OID Filter Value">
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-6 col-lg-3">
                    <div class="card text-white h-100">
                        <div class="card-header">Time</div>
                        <div class="card-body">
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="time-filter-enable">
                                <label class="form-check-label" for="time-filter-enable">Enable Filter</label>
                            </div>
                            <div class="mb-2">
                                <label class="form-label" for="time-filter-from">From:</label>
                                <input type="date" class="form-control" id="time-filter-from">
                                <span class="small text-secondary">00:00:00</span>
                            </div>
                            <div>
                                <label class="form-label" for="time-filter-to">To:</label>
                                <input type="date" class="form-control" id="time-filter-to">
                                <span class="small text-secondary">00:00:00</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-6 col-lg-3">
                    <div class="card text-white h-100">
                        <div class="card-header">Name</div>
                        <div class="card-body">
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="name-filter-enable">
                                <label class="form-check-label" for="name-filter-enable">Enable Filter</label>
                            </div>
                            <input type="text" class="form-control" id="name-filter" placeholder="Name Filter Value">
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-6 col-lg-3">
                    <div class="card text-white h-100">
                        <div class="card-header">Alliance</div>
                        <div class="card-body">
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="AN-filter-enable">
                                <label class="form-check-label" for="AN-filter-enable">Enable Filter</label>
                            </div>
                            <input type="text" class="form-control" id="AN-filter" placeholder="Alliance Filter Value">
                        </div>
                    </div>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col text-center">
                    <button type="button" class="btn btn-outline-light" onclick="applyFilters()">Apply Filters</button>
                </div>
            </div>
        </div>
    </div>
    <div class="js-sorting">
        <div class="container my-4" id="sorting-container">
            <h2 class="text-center text-white mb-4">Sorting</h2>
            <div class="row g-3">
                <div class="col-12 col-md-6 col-lg-3">
                    <div class="card text-white p-3 card-custom h-100">
                        <div class="card-header">OID</div>
                        <div class="card-body">
                            <div class="mb-2">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="OID-sort-priority" value="0"
                                        id="OID-prio-1">
                                    <label class="form-check-label" for="OID-prio-1">Sorting Priority: 1</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="OID-sort-priority" value="1"
                                        id="OID-prio-2">
                                    <label class="form-check-label" for="OID-prio-2">Sorting Priority: 2</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="OID-sort-priority" value="2"
                                        id="OID-prio-3">
                                    <label class="form-check-label" for="OID-prio-3">Sorting Priority: 3</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="OID-sort-priority" value="3"
                                        id="OID-prio-4" checked>
                                    <label class="form-check-label" for="OID-prio-4">Sorting Priority: 4</label>
                                </div>
                            </div>
                            <div class="form-check mt-2">
                                <input class="form-check-input" type="checkbox" id="OID-sort-reverse">
                                <label class="form-check-label" for="OID-sort-reverse">Reverse (Largest to
                                    Smallest)</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-6 col-lg-3">
                    <div class="card text-white p-3 card-custom h-100">
                        <div class="card-header">Time</div>
                        <div class="card-body">
                            <div class="mb-2">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="time-sort-priority" value="0"
                                        id="time-prio-1">
                                    <label class="form-check-label" for="time-prio-1">Sorting Priority: 1</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="time-sort-priority" value="1"
                                        id="time-prio-2">
                                    <label class="form-check-label" for="time-prio-2">Sorting Priority: 2</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="time-sort-priority" value="2"
                                        id="time-prio-3">
                                    <label class="form-check-label" for="time-prio-3">Sorting Priority: 3</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="time-sort-priority" value="3"
                                        id="time-prio-4" checked>
                                    <label class="form-check-label" for="time-prio-4">Sorting Priority: 4</label>
                                </div>
                            </div>
                            <div class="form-check mt-2">
                                <input class="form-check-input" type="checkbox" id="time-sort-reverse">
                                <label class="form-check-label" for="time-sort-reverse">Reverse (Latest to
                                    Oldest)</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-6 col-lg-3">
                    <div class="card text-white p-3 card-custom h-100">
                        <div class="card-header">Name</div>
                        <div class="card-body">
                            <div class="mb-2">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="name-sort-priority" value="0"
                                        id="name-prio-1">
                                    <label class="form-check-label" for="name-prio-1">Sorting Priority: 1</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="name-sort-priority" value="1"
                                        id="name-prio-2">
                                    <label class="form-check-label" for="name-prio-2">Sorting Priority: 2</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="name-sort-priority" value="2"
                                        id="name-prio-3">
                                    <label class="form-check-label" for="name-prio-3">Sorting Priority: 3</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="name-sort-priority" value="3"
                                        id="name-prio-4" checked>
                                    <label class="form-check-label" for="name-prio-4">Sorting Priority: 4</label>
                                </div>
                            </div>
                            <div class="form-check mt-2">
                                <input class="form-check-input" type="checkbox" id="name-sort-reverse">
                                <label class="form-check-label" for="name-sort-reverse">Reverse (Z to A)</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-6 col-lg-3">
                    <div class="card text-white p-3 card-custom h-100">
                        <div class="card-header">Alliance</div>
                        <div class="card-body">
                            <div class="mb-2">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="AN-sort-priority" value="0"
                                        id="AN-prio-1">
                                    <label class="form-check-label" for="AN-prio-1">Sorting Priority: 1</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="AN-sort-priority" value="1"
                                        id="AN-prio-2">
                                    <label class="form-check-label" for="AN-prio-2">Sorting Priority: 2</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="AN-sort-priority" value="2"
                                        id="AN-prio-3">
                                    <label class="form-check-label" for="AN-prio-3">Sorting Priority: 3</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="AN-sort-priority" value="3"
                                        id="AN-prio-4" checked>
                                    <label class="form-check-label" for="AN-prio-4">Sorting Priority: 4</label>
                                </div>
                            </div>
                            <div class="form-check mt-2">
                                <input class="form-check-input" type="checkbox" id="AN-sort-reverse">
                                <label class="form-check-label" for="AN-sort-reverse">Reverse (Z to A)</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col text-center">
                    <button type="button" class="btn btn-outline-light me-2" onclick="applySorting()">Apply
                        Sorting</button>
                    <button type="button" class="btn btn-outline-light" onclick="applyFilters(); applySorting()">Apply
                        Filters + Sorting</button>
                </div>
            </div>
        </div>
    </div>
    <section>
        <h1 class="text-center">Search Results</h1>
        <table id="result-table" class="main-table">
            <tr>
                <th>OID</th>
                <th>Time</th>
                <th>Name</th>
                <th>Alliance</th>
            </tr>
        </table>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"></script>
</body>

</html>
